map "$request_method:$uri" $itam_auth_ip {
    default "";
    "POST:/admin/login/" $binary_remote_addr;
    "POST:/cuenta/recuperar/" $binary_remote_addr;
}
limit_req_zone $itam_auth_ip zone=itam_auth:10m rate=6r/m;

# Omitir rutas, consultas, direcciones y cabeceras de los logs de acceso.
log_format itam_access '$time_iso8601 $request_method $status $request_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;
    access_log /var/log/nginx/access.log itam_access;

    location /static/ {
        alias /app/static/;
    }

    location = /media {
        return 404;
    }

    # Los documentos solo se entregan mediante vistas con permisos.
    location ^~ /media/ {
        return 404;
    }

    location / {
        limit_req zone=itam_auth burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level info;

        proxy_read_timeout 120s;
        proxy_pass http://itam-web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
