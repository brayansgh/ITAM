server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    location /static/ {
        alias /app/src/static/;
    }

    location = /media {
        return 404;
    }

    # Los documentos solo se entregan mediante vistas con permisos.
    location ^~ /media/ {
        return 404;
    }

    location / {
        proxy_pass http://itam-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
