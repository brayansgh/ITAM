server {
    listen 80;
    server_name localhost 127.0.0.1;
    client_max_body_size 10M;
    access_log off;

    location /static/ {
        alias /app/static/;
    }

    location = /media {
        return 404;
    }

    location ^~ /media/ {
        return 404;
    }

    location / {
        proxy_read_timeout 120s;
        proxy_pass http://itam-web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
