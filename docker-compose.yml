x-logging: &rotating-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"


services:
  itam-db:
    image: postgres:16-alpine
    container_name: itam-db
    restart: always
    logging: *rotating-logs
    volumes:
      - ./postgres:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    networks:
      - itam_network

  itam-web:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: itam-web
    restart: always
    logging: *rotating-logs
    command:
      - sh
      - -ec
      - |
        python manage.py collectstatic --noinput --clear
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --threads 4 --timeout 120
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_STATIC_ROOT: /app/static
    volumes:
      - ./src:/app/src
      - ./media:/app/src/media
      - itam_static:/app/static
    env_file:
      - .env
    depends_on:
      - itam-db
    networks:
      - itam_network

  itam-nginx:
    image: nginx:alpine
    container_name: itam-nginx
    restart: always
    logging: *rotating-logs
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - itam_static:/app/static:ro
    depends_on:
      - itam-web
    networks:
      - itam_network

volumes:
  itam_static:

networks:
  itam_network:
    driver: bridge
