
services:
  itam-db:
    image: postgres:16-alpine
    container_name: itam-db
    restart: always
    volumes:
      - ./postgres:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    networks:
      - itam_network

  itam-web:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: itam-web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app/src
      - ./media:/app/src/media
    env_file:
      - .env
    depends_on:
      - itam-db
    networks:
      - itam_network

  itam-nginx:
    image: nginx:alpine
    container_name: itam-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/static:/app/src/static:ro
      - ./media:/app/src/media:ro
      - ./media:/app/media:ro
    depends_on:
      - itam-web
    networks:
      - itam_network

networks:
  itam_network:
    driver: bridge
